<!-- One publication. Params: pub (an item from _data/publications.yml) -->
{% assign pub = include.pub %}
<div class="publication{% if pub.image %} has-image{% endif %}">
  {% if pub.image %}
    <img src="{{ pub.image | relative_url }}" alt="{{ pub.image_alt | default: pub.title }}">
  {% endif %}
  <div>
    <div class="publication-title">{{ pub.title }}</div>
    <div class="publication-authors">{{ pub.authors | markdownify | remove: '<p>' | remove: '</p>' }}</div>
    <div class="publication-venue">{{ pub.venue }}</div>
    {% if pub.summary %}<p class="publication-summary">{{ pub.summary }}</p>{% endif %}
  </div>
</div>
