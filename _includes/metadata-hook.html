<!-- Extra structured data for search engines. Chirpy includes this at the end of <head>. -->
{% assign home_url = '/' | absolute_url %}

{% if page.layout == 'home' %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": {{ home_url | append: '#person' | jsonify }},
      "name": {{ site.author.name | jsonify }},
      "alternateName": ["Ong Dun Yan"],
      "givenName": "Dun Yan",
      "familyName": "Ong",
      "url": {{ home_url | jsonify }},
      "image": {{ site.avatar | absolute_url | jsonify }},
      "email": {{ site.social.email | prepend: 'mailto:' | jsonify }},
      "jobTitle": "Robotics Researcher",
      "affiliation": [
        { "@type": "CollegeOrUniversity", "name": "Nanyang Technological University" },
        { "@type": "ResearchOrganization", "name": "Robotics Autonomy and Planning Lab, Shanghai Jiao Tong University" }
      ],
      "knowsAbout": [
        "Multi-robot systems",
        "Motion planning",
        "Multi-agent path finding",
        "Model predictive control",
        "Robot perception",
        "Point cloud processing",
        "ROS 2"
      ],
      "sameAs": {{ site.social.links | jsonify }}
    }
  </script>
{% endif %}

{% if page.paper %}
  {% assign paper = page.paper %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ScholarlyArticle",
      "headline": {{ paper.title | jsonify }},
      "name": {{ paper.title | jsonify }},
      "alternateName": {{ paper.alternate_name | jsonify }},
      "description": {{ page.description | jsonify }},
      "author": [
        {% for a in paper.authors %}
          {
            "@type": "Person",
            "name": {{ a | jsonify }}
            {%- if a == site.author.name -%}
              , "@id": {{ home_url | append: '#person' | jsonify }}, "url": {{ home_url | jsonify }}
            {%- endif %}
          }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ],
      "creativeWorkStatus": {{ paper.status | jsonify }},
      "sourceOrganization": { "@type": "Organization", "name": {{ paper.affiliation | jsonify }} },
      "keywords": {{ paper.keywords | join: ', ' | jsonify }},
      "image": {{ page.image.path | absolute_url | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
      "inLanguage": "en"
    }
  </script>
{% endif %}
