<!-- A project card. Params: project (an item from _data/projects.yml) -->
{% assign p = include.project %}
<div class="card project-card">
  {% if p.image %}
    <img src="{{ p.image | relative_url }}" alt="{{ p.name }}" class="project-img">
  {% endif %}
  <div class="card-body d-flex flex-column">
    <h3 class="card-title">{{ p.name }}</h3>
    <p class="card-text">{{ p.summary }}</p>
    <div class="project-stack">
      {% for s in p.stack %}<span class="project-tag">{{ s }}</span>{% endfor %}
    </div>
    <div class="project-links">
      {% if p.repo %}
        <a href="{{ p.repo }}"><i class="fab fa-github"></i> Code</a>
      {% else %}
        <span class="text-muted"><i class="fas fa-lock"></i> Team repo (private)</span>
      {% endif %}
      {% if p.post %}
        <a href="{{ p.post | relative_url }}"><i class="far fa-file-alt"></i> Write-up</a>
      {% endif %}
    </div>
  </div>
</div>
