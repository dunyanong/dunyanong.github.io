- title: "VADER: Decentralized Multi-Robot Navigation in Unknown Environments via Encounter-Triggered Visibility Graph Merging"
  authors: "**Dun Yan Ong**, Xuemian Wu, Shenghai Yuan, Zhongqiang Ren"
  venue: "Submitted to IEEE International Conference on Robotics and Automation (ICRA), 2027"
  summary: "Robots merge their visibility graphs when they meet, then jointly schedule routes and passage order with conflict-based search over a space-time visibility graph. 87% all-robot success vs. 53% for the strongest reactive baseline across 4 environments with 2–10 robots; validated on 4–8 Robotarium robots."
