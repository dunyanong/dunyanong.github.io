# Projects grouped by theme. `featured: true` puts a project on the home page.
# Projects without `repo` render as "Code private".
- theme: Research
  items:
    - name: VADER — Decentralized Multi-Robot Navigation
      summary: "Robots merge their visibility graphs when they meet and jointly schedule who passes first. 87% all-robot success vs. 53% for the best reactive baseline. First-author ICRA 2027 submission."
      stack: [C++, ROS, CBS, Visibility Graphs]
      post: /posts/vader/
      image: /assets/img/projects/vader/warehouse-4-robots.gif
    - name: VADER on the Robotarium
      summary: "The same planner running remotely on Georgia Tech's Robotarium with 4–8 real robots. Every robot reached its goal in every trial, with no contacts."
      stack: [Python, Multi-Robot, Real Robots]
      post: /posts/vader/#robotarium
      image: /assets/img/projects/vader/robotarium-8-robots.jpg
    - name: ST-AVL — Gaze Attention Grounding
      summary: "Side project: which object is a person looking at, from two cheap cameras and no wearables? A 3D gaze ray built up as evidence in a spatio-temporal voxel grid."
      stack: [C++, Python, ROS 2, Gaze Estimation]
      post: /posts/st-avl-gaze-grounding/
      featured: true

- theme: ICRA BARN Challenge 2026
  items:
    - name: NMPC Navigation Stack
      summary: "Nonlinear MPC in acados that handles static walls and up to ten tracked moving obstacles in one optimisation. 3rd in the physical finals at ICRA 2026, Vienna."
      stack: [C++, acados, ROS, Optimal Control]
      repo: https://github.com/Team-Robo/core-mode_switching_mpc_2026
      post: /posts/barn-2026/
      image: /assets/img/projects/barn2026/jackal-in-course.jpg
      featured: true
    - name: D* Lite Global Planner
      summary: "Incremental D* Lite global planner plugin for move_base that replans quickly when the map changes."
      stack: [C++, ROS, Incremental Search]
      repo: https://github.com/Team-Robo/nav-D_Lite
    - name: Visibility-Graph Global Planner
      summary: "move_base global planner that wraps costmap obstacles in polygons, links mutually visible corners and searches for the shortest route, even in unknown maps."
      stack: [C++, ROS, Visibility Graphs]

- theme: Embodied AI — RoboCup@Home 2027
  items:
    - name: Free-Seat Detection
      summary: "Finds seats in 3D, remembers them while people hide them, and only offers a seat it is sure is free. CPU only, on the robot's Jetson Orin."
      stack: [Python, ROS 2, YOLO, RGB-D]
      post: /posts/robocup-home/
      image: /assets/img/projects/robocup/seat-detection-output.jpg
      featured: true
    - name: 6-DoF Object Pose via MAC Registration
      summary: "Registers a known object against the live RealSense cloud with maximal-clique registration (CVPR'23). A quality gate rejects doubtful poses."
      stack: [C++, ROS 2, PCL, Point Cloud Registration]
      post: /posts/robocup-home/
      image: /assets/img/projects/mac_registration.gif
      featured: true
    - name: Offline Speech Commands
      summary: "On-robot Whisper speech recognition with intent parsing. Returns ACCEPT, CONFIRM or REJECT, so a misheard word costs one confirmation, not a repeat."
      stack: [C++, ROS 2, Whisper]
      post: /posts/robocup-home/
      featured: true
    - name: Self-Built Wheeled Humanoid
      summary: "Hardware by Aqid, Jing Yang and the hardware team: our own robot, with a mecanum base, a vertical lift and two OpenArm arms, alongside the Galaxea R1 we develop on today."
      stack: [CAD, Hardware]
      post: /posts/robocup-home/
      image: /assets/img/projects/robocup/custom-robot-openarm-cad.jpg
    - name: L2CS Gaze Estimation
      summary: "ROS 2 package for real-time webcam gaze estimation with L2CS-Net (ResNet-50, Gaze360), with RViz gaze-ray visualisation."
      stack: [Python, ROS 2, PyTorch]
      repo: https://github.com/Team-Robo/archived-perc-l2cs_gaze_perception

- theme: Industry
  items:
    - name: Camera Obstacle Detection (Hyundai)
      summary: "Covers 2D-LiDAR blind spots with a depth camera: nearly 100% detection, zero false positives, over 15 Hz on CPU."
      stack: [C++, PCL, RGB-D, Nav2]
      post: /posts/hyundai-camera-obstacle-detection/
      featured: true
    - name: Robot Self-Occlusion Removal (A*STAR)
      summary: "PointNet segmentation that removes a UR16e arm from its own point cloud for human–robot collision avoidance: 98.79% accuracy, 98% IoU."
      stack: [PyTorch, PointNet, PCL, ROS]
      post: /posts/astar-occlusion-removal/

- theme: Earlier Projects
  items:
    - name: Conflict-Based Search in C++
      summary: "Multi-agent path finding from scratch: Dijkstra, A*, space-time A*, CBS, MovingAI benchmark parsers and OpenCV animation."
      stack: [C++, OpenCV, Search]
      repo: https://github.com/dunyanong/conflict-based-search
      post: /posts/multi-agent-path-finding/
      image: /assets/img/dy04/mapf_toy.gif
    - name: Frontier-Based Exploration
      summary: "Exploration of unknown maps in ROS, built without the navigation stack: OctoMap, frontier clustering, A* and fallback behaviours."
      stack: [C++, ROS, OctoMap]
      repo: https://github.com/dunyanong/exploration-preresearch
      post: /posts/autonomous-exploration/
    - name: Wireless Motor Drive (URECA)
      summary: "A simulated inductive wireless power link driving a PMSM with SPWM control. President's Research Scholar."
