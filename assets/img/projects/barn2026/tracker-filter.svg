<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The raw tracker reports phantom movers along walls; the filter passes only real moving obstacles to the controller</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker></defs>
<rect width="800" height="380" fill="#ffffff"/>
<rect x="20" y="20" width="360" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="52" font-size="18" font-weight="600" fill="#111827">Raw tracker output</text>
<rect x="40" y="290" width="75" height="28" fill="#e7d3b0" stroke="#b08d57"/>
<rect x="121" y="290" width="92" height="28" fill="#e7d3b0" stroke="#b08d57"/>
<rect x="219" y="290" width="79" height="28" fill="#e7d3b0" stroke="#b08d57"/>
<rect x="304" y="290" width="56" height="28" fill="#e7d3b0" stroke="#b08d57"/>
<g transform="translate(100 210) rotate(0) scale(0.75)"><rect x="-24" y="-31" width="16" height="8" rx="2" fill="#111827"/><rect x="10" y="-31" width="16" height="8" rx="2" fill="#111827"/><rect x="-24" y="23" width="16" height="8" rx="2" fill="#111827"/><rect x="10" y="23" width="16" height="8" rx="2" fill="#111827"/><rect x="-36" y="-24" width="72" height="48" rx="9" fill="#facc15" stroke="#a16207" stroke-width="2"/><rect x="-26" y="-17" width="52" height="34" rx="4" fill="#1f2937"/><circle cx="4" cy="0" r="5" fill="#f97316"/><line x1="-18" y1="-10" x2="-18" y2="-22" stroke="#111827" stroke-width="2"/><polygon points="30,-6 38,0 30,6" fill="#a16207"/></g>
<circle cx="270" cy="130" r="20" fill="#0891b2"/>
<line x1="270" y1="153" x2="270" y2="200" stroke="#0e7490" stroke-width="3" marker-end="url(#arrc)"/>
<text x="298" y="128" font-size="14" fill="#0e7490">moving</text>
<circle cx="170" cy="274" r="11" fill="#f87171" fill-opacity="0.85"/>
<line x1="170" y1="274" x2="186" y2="262" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="240" cy="274" r="11" fill="#f87171" fill-opacity="0.85"/>
<line x1="240" y1="274" x2="226" y2="264" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="320" cy="274" r="11" fill="#f87171" fill-opacity="0.85"/>
<line x1="320" y1="274" x2="332" y2="260" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
<text x="40" y="345" font-size="14" fill="#b91c1c">wall noise looks like motion</text>
<rect x="420" y="20" width="360" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="440" y="52" font-size="18" font-weight="600" fill="#111827">What reaches the controller</text>
