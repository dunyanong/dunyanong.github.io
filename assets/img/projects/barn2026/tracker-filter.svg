<rect x="521" y="290" width="92" height="28" fill="#e7d3b0" stroke="#b08d57"/>
<rect x="619" y="290" width="79" height="28" fill="#e7d3b0" stroke="#b08d57"/>
<rect x="704" y="290" width="56" height="28" fill="#e7d3b0" stroke="#b08d57"/>
<g transform="translate(500 210) rotate(0) scale(0.75)"><rect x="-24" y="-31" width="16" height="8" rx="2" fill="#111827"/><rect x="10" y="-31" width="16" height="8" rx="2" fill="#111827"/><rect x="-24" y="23" width="16" height="8" rx="2" fill="#111827"/><rect x="10" y="23" width="16" height="8" rx="2" fill="#111827"/><rect x="-36" y="-24" width="72" height="48" rx="9" fill="#facc15" stroke="#a16207" stroke-width="2"/><rect x="-26" y="-17" width="52" height="34" rx="4" fill="#1f2937"/><circle cx="4" cy="0" r="5" fill="#f97316"/><line x1="-18" y1="-10" x2="-18" y2="-22" stroke="#111827" stroke-width="2"/><polygon points="30,-6 38,0 30,6" fill="#a16207"/></g>
<circle cx="670" cy="130" r="20" fill="#0891b2"/>
